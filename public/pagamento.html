<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status do pagamento | Loja Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#171613;--muted:#77736b;--line:#e9e4dc;--soft:#f7f4ef;--success:#2f6b49;--warning:#8a651a;--danger:#9e3d3d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px;display:grid;place-items:center;font-family:Inter,sans-serif;color:var(--ink);background:var(--soft)}
    a{text-decoration:none;color:inherit}.page{width:min(720px,100%)}
    .brand{width:max-content;margin:0 auto 28px;display:flex;align-items:center;gap:12px}
    .brand-mark{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--ink);font-family:"Playfair Display",serif;font-size:21px}
    .brand strong{display:block;font-family:"Playfair Display",serif;font-size:22px;font-weight:600;line-height:1}
    .brand small{display:block;margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:.2em;text-transform:uppercase}
    .card{background:#fff;border:1px solid var(--line)}
    .hero{padding:48px 46px 30px;text-align:center;border-bottom:1px solid var(--line)}
    .icon{width:58px;height:58px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--soft);font-size:24px}
    .icon.success{color:var(--success);border-color:#cde1d4;background:#f2f8f4}
    .icon.pending{color:var(--warning);border-color:#eadbb9;background:#fcf8ed}
    .icon.failure{color:var(--danger);border-color:#ebcaca;background:#fff4f4}
    .eyebrow{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:10px 0 14px;font-family:"Playfair Display",serif;font-size:clamp(34px,6vw,48px);font-weight:500;line-height:1.04}
    .message{max-width:540px;margin:0 auto;color:var(--muted);line-height:1.75}
    .content{padding:30px 46px 42px}.summary{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .summary-row{display:flex;justify-content:space-between;gap:24px;padding:16px 0;border-bottom:1px solid var(--line);font-size:13px}
    .summary-row:last-child{border-bottom:0}.summary-row span{color:var(--muted)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
    .button{min-height:48px;padding:14px 18px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;text-align:center;cursor:pointer}
    .button.secondary{background:#fff;color:var(--ink)}
    .button.refresh{grid-column:1/-1;border-color:var(--line);background:var(--soft);color:var(--ink)}
    .button.whatsapp{grid-column:1/-1;border-color:var(--line);background:#fff;color:var(--ink)}
    .button:disabled{opacity:.55;cursor:wait}
    .note{margin:22px 0 0;color:#9a968f;font-size:11px;line-height:1.6;text-align:center}.hidden{display:none!important}
    @media(max-width:620px){body{padding:14px}.hero{padding:36px 22px 24px}.content{padding:24px 22px 30px}.actions{grid-template-columns:1fr}.button.refresh,.button.whatsapp{grid-column:auto}}
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="index.html" aria-label="Loja Demo">
      <span class="brand-mark">L</span>
      <span><strong>Loja</strong><small>Demo</small></span>
    </a>

    <main class="card">
      <section class="hero">
        <div class="icon pending" id="statusIcon">…</div>
        <span class="eyebrow">Status do pedido</span>
        <h1 id="statusTitle">Confirmando pagamento</h1>
        <p class="message" id="statusMessage">Estamos consultando a confirmação enviada pelo Mercado Pago.</p>
      </section>

      <section class="content">
        <div class="summary">
          <div class="summary-row"><span>Pedido</span><strong id="orderNumber">—</strong></div>
          <div class="summary-row"><span>Total</span><strong id="orderTotal">—</strong></div>
          <div class="summary-row"><span>Pagamento</span><strong id="paymentStatus">Consultando...</strong></div>
        </div>

        <div class="actions">
          <a class="button hidden" id="trackOrder" href="#">Acompanhar pedido</a>
          <a class="button secondary" href="index.html">Voltar para a loja</a>
          <button class="button refresh" id="retryStatus" type="button">Atualizar confirmação</button>
          <a class="button whatsapp" href="https://wa.me/5564999999999?text=Olá%2C%20preciso%20de%20ajuda%20com%20meu%20pedido%20na%20Loja%20Demo." target="_blank" rel="noopener">Falar com a loja</a>
        </div>

        <p class="note">A confirmação oficial é consultada no servidor e pode levar alguns instantes.</p>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script type="module" src="pagamento.js"></script>
</body>
</html>
