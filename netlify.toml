[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/create-checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200


[[redirects]]
  from = "/api/validate-coupon"
  to = "/.netlify/functions/validate-coupon"
  status = 200

[[redirects]]
  from = "/api/order-status"
  to = "/.netlify/functions/order-status"
  status = 200

[[redirects]]
  from = "/api/reconcile-payment"
  to = "/.netlify/functions/reconcile-payment"
  status = 200

[[redirects]]
  from = "/api/mercadopago-webhook"
  to = "/.netlify/functions/mercadopago-webhook"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
